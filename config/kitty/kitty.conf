font_family      JetBrainsMono Nerd Font Mono
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

modify_font cell_height +2px

map kitty_mod+equal       change_font_size all +1.0
map kitty_mod+plus        change_font_size all +1.0
map kitty_mod+kp_add      change_font_size all +1.0
map kitty_mod+minus       change_font_size all -1.0
map kitty_mod+kp_subtract change_font_size all -1.0

map kitty_mod+m           remote_control set-background-opacity --all --toggle 1.0

enable_audio_bell     no
visual_bell_duration  0.0
bell_on_tab           no
window_alert_on_bell  no

remember_window_size   no
initial_window_width   80c
initial_window_height  24c

window_padding_width 10 10 5 10

hide_window_decorations no

background_opacity         0.92
dynamic_background_opacity yes

cursor_beam_thickness 1.5

include themes/catppuccin
