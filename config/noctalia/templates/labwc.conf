# global / window border
border.width: 1
window.active.border.color: {{colors.primary.default.hex}}
window.inactive.border.color: {{colors.outline.default.hex}}
window.active.indicator.toggled-keybind.color: {{colors.inverse_primary.default.hex}}

# window titlebar background (elevated surface, not the accent hue)
window.active.title.bg: Solid
window.inactive.title.bg: Solid
window.active.title.bg.color: {{colors.surface.default.hex}}
window.inactive.title.bg.color: {{colors.surface_container.default.hex}}
window.titlebar.padding.width: 6

window.active.label.text.color: {{colors.on_surface.default.hex}}
window.inactive.label.text.color: {{colors.on_surface_variant.default.hex}}
window.label.text.justify: center

# window buttons
window.button.width: 26
window.button.height: 26
window.button.spacing: 2

window.active.button.unpressed.image.color: {{colors.on_surface_variant.default.hex}}
window.active.button.hover.image.color: {{colors.primary.default.hex}}
window.active.button.pressed.image.color: {{colors.primary.default.hex}}
window.inactive.button.unpressed.image.color: {{colors.on_surface_variant.default.hex}}
window.inactive.button.hover.image.color: {{colors.on_surface_variant.default.hex}}
window.inactive.button.pressed.image.color: {{colors.on_surface_variant.default.hex}}

# menu
menu.overlap.x: 0
menu.overlap.y: 0
menu.width.min: 160
menu.width.max: 260
menu.border.width: 1
menu.border.color: {{colors.outline.default.hex}}
menu.items.padding.x: 8
menu.items.padding.y: 5
menu.items.bg.color: {{colors.surface_container_high.default.hex}}
menu.items.text.color: {{colors.on_surface.default.hex}}
menu.items.active.bg.color: {{colors.primary.default.hex}}
menu.items.active.text.color: {{colors.on_primary.default.hex}}
menu.separator.width: 1
menu.separator.padding.width: 6
menu.separator.padding.height: 3
menu.separator.color: {{colors.outline_variant.default.hex}}
menu.title.bg.color: {{colors.surface_container_high.default.hex}}
menu.title.text.color: {{colors.on_surface.default.hex}}
menu.title.text.justify: center

# on screen display (window-cycle dialog)
osd.bg.color: {{colors.surface_container_high.default.hex}}
osd.border.color: {{colors.outline.default.hex}}
osd.border.width: 1
osd.label.text.color: {{colors.on_surface.default.hex}}
osd.window-switcher.preview.border.color: {{colors.primary.default.hex}},{{colors.outline.default.hex}},{{colors.primary.default.hex}}

# window switcher
osd.window-switcher.style-thumbnail.width.max: 70%
osd.window-switcher.style-thumbnail.padding: 8
osd.window-switcher.style-thumbnail.item.width: 220
osd.window-switcher.style-thumbnail.item.height: 160
osd.window-switcher.style-thumbnail.item.padding: 4
osd.window-switcher.style-thumbnail.item.active.border.color: {{colors.primary.default.hex}}
osd.window-switcher.style-thumbnail.item.active.bg.color: {{colors.surface_container_highest.default.hex}}
osd.window-switcher.style-thumbnail.item.icon.size: 48

# window switcher
osd.window-switcher.style-classic.width: 70%
osd.window-switcher.style-classic.padding: 8
osd.window-switcher.style-classic.item.padding.x: 10
osd.window-switcher.style-classic.item.padding.y: 4
osd.window-switcher.style-classic.item.active.border.color: {{colors.primary.default.hex}}
osd.window-switcher.style-classic.item.active.bg.color: {{colors.surface_container_highest.default.hex}}
osd.window-switcher.style-classic.item.icon.size: 32

# workspace switcher OSD
osd.workspace-switcher.boxes.width: 16
osd.workspace-switcher.boxes.height: 16
osd.workspace-switcher.boxes.border.width: 2
osd.workspace-switcher.boxes.border.color: {{colors.outline.default.hex}}

# snapping overlay
snapping.overlay.region.bg.enabled: yes
snapping.overlay.edge.bg.enabled: yes
snapping.overlay.region.bg.color: {{colors.primary.default.hex}} 60
snapping.overlay.edge.bg.color: {{colors.primary.default.hex}} 60
snapping.overlay.region.border.enabled: no
snapping.overlay.edge.border.enabled: no

# magnifier
magnifier.border.width: 2
magnifier.border.color: {{colors.error.default.hex}}

# drop shadows
window.active.shadow.size: 24
window.inactive.shadow.size: 16
window.active.shadow.color: {{colors.shadow.default.hex}} 60
window.inactive.shadow.color: {{colors.shadow.default.hex}} 40
