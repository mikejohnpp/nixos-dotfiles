[bar.default]
background_opacity = 0.6
border = "on_error"
center = []
end = [ "tray", "network", "battery", "volume", "bluetooth", "brightness", "notifications", "clock", "control-center" ]
font_family = "JetBrainsMono NFP"
margin_ends = 0
radius = 0
shadow = false
start = [ "launcher", "workspaces" ]
thickness = 28
widget_spacing = 15

[control_center]
sidebar = "full"
sidebar_section = "full"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true
sunrise = "06:00"
sunset = "18:00"

[lockscreen_widgets]
enabled = false

[shell]
font_family = "JetBrainsMono NFP"
telemetry_enabled = false

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_launcher = true
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
directory = "/home/mikejohnp/bg"

[widget.workspaces]
show_labels = false

[brightness]
enable_ddcutil = true

[nightlight]
enabled = true
force = false
temperature_night = 4400

# Sync Noctalia's current color palette into labwc's themerc-override
# (titlebar, menu, OSD colors) and reconfigure labwc whenever it changes.
[theme.templates]
enable_builtin_templates = true
builtin_ids = []

[theme.templates.user.labwc-themerc]
input_path = "~/.config/noctalia/templates/labwc.conf"
output_path = "~/.config/labwc/themerc-override"
post_hook = "labwc --reconfigure"
