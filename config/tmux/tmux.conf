# set -g default-terminal "xterm-256color"
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -sg escape-time 10

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

unbind %
bind '\' split-window -h -c '#{pane_current_path}'
bind '¥' split-window -h -c '#{pane_current_path}'

bind t display-popup -d "#{pane_current_path}" -E "zsh"

# new window
bind c new-window -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Split pane and open PowerShell in the same directory
bind | split-window -h "powershell.exe -NoExit -Command cd \"$(wslpath -w '#{pane_current_path}')\""
bind _ split-window -v "powershell.exe -NoExit -Command cd \"$(wslpath -w '#{pane_current_path}')\""
bind T display-popup -d "#{pane_current_path}" -E "powershell.exe -NoExit -Command cd \"$(wslpath -w '#{pane_current_path}')\""
bind C new-window "powershell.exe -NoExit -Command cd \"$(wslpath -w '#{pane_current_path}')\""

unbind r 
# tmux source-file ~/.tmux.conf \;
bind r source-file ~/.tmux.conf

bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

bind -r m resize-pane -Z

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane


# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# ==========================================
# Terminal Palette Color Variables
# Inherit from terminal ANSI colors 0-15 — theme-aware
# ==========================================
set -g @tk_bg "default"
set -g @tk_fg "default"
set -g @tk_black "colour0"
set -g @tk_surface_0 "colour0"
set -g @tk_surface_1 "colour8"
set -g @tk_surface_2 "colour8"
set -g @tk_comment "colour8"
set -g @tk_subtext "colour7"
set -g @tk_red "colour1"
set -g @tk_green "colour2"
set -g @tk_yellow "colour3"
set -g @tk_blue "colour4"
set -g @tk_magenta "colour5"
set -g @tk_cyan "colour6"
set -g @tk_orange "colour11"

# ==========================================
# Configure Tmux
# ==========================================
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "left"

# Style
set -g @custom_status_separator "#[fg=#{@tk_surface_2},bg=default,none]"
set -g @custom_status_inline "󱋱"
set -g @custom_text "#[fg=#{@tk_subtext}]"

# status left look and feel
set -g status-left-length 80
set -g status-left ""

# status left modules
set -ga status-left "#[fg=#{@tk_blue}]#{?client_prefix,#[fg=#{@tk_red}],} 󰆍 #S 󰅂  #[none]"

# status right look and feel
set -g status-right-length 160
set -g status-right ""

# status right modules
# set -ga status-right "#{E:#{@custom_status_separator}}"
set -ga status-right "#[fg=#{@tk_blue}] 󰉋 #{E:#{@custom_text}}#{b:pane_current_path} "

# set -ga status-right "#{E:#{@custom_status_separator}}"
set -ga status-right "#[fg=#{@tk_magenta}] #{?#([ -f "/.dockerenv" ] && echo true),󰒋 , }#{E:#{@custom_text}}#h "
# set -ga status-right "#[fg=#{@tk_cyan}]#{E:#{@custom_status_inline}} 󱨰 #{E:#{@custom_text}}%Y-%m-%d "
# set -ga status-right "#[fg=#{@tk_cyan}]#{E:#{@custom_status_inline}} 󰅐 #{E:#{@custom_text}}%H:%M "

# pane border look and feel
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@tk_orange},bg=default"
setw -g pane-border-style "fg=#{@tk_comment},bg=default"
setw -g pane-border-lines single

# popup style
setw -g popup-border-style "fg=#{@tk_orange},bg=default"

# command line look and feel
set -g message-style "bg=#{@tk_surface_0}, fg=#{@tk_fg}"
set -g message-command-style "bg=#{@tk_black}, fg=#{@tk_fg}"

default_window_terminal=""
default_window_number="#[bg=#{@tk_surface_1},fg=#{@tk_fg}] #I #[bg=default,none]"
default_window_name=" #[fg=#{@tk_comment}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"
default_window_panes="#[fg=#{@tk_surface_1}] "
default_window_flags="\
#{?#{window_last_flag},,󰖰 }\
#{?#{window_marked_flag},󰙒 ,}\
#{?#{window_zoomed_flag},󰁌 ,}\
"

current_window_terminal=""
current_window_number="#[bg=#{@tk_orange},fg=#{@tk_black},bold] #I #[bg=default,none]"
current_window_name=" #[fg=#{@tk_fg},bold]#{?#{==:#{window_name},window},#{pane_current_command},#W}"
current_window_panes="#[fg=#{@tk_comment}] "
current_window_flags="#[fg=#{@tk_yellow}]\
#{?#{window_marked_flag},󰙒 ,}\
#{?#{window_zoomed_flag},󰁌 ,}\
"

# --- WINDOW STATUS FORMAT ---
# set -gF window-status-separator "#[fg=#{@tk_surface_1}]|"
# Lắp ráp các thành phần lại với nhau
set -g window-status-format "$default_window_terminal$default_window_number$default_window_name$default_window_panes$default_window_flags"
set -g window-status-style "bg=default"

set -g window-status-current-format "$current_window_terminal$current_window_number$current_window_name$current_window_panes$current_window_flags"
set -g window-status-current-style "bg=default"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
